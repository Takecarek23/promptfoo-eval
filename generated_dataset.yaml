- vars:
    context: file://./raw/ch01_introduction.md
    question: AI Agent là gì?
  assert:
  - type: llm-rubric
    value: Trả lời chính xác định nghĩa của AI Agent (tác nhân trí tuệ nhân tạo) và
      nêu rõ sự khác biệt so với chatbot thông thường.
    provider: ollama:chat:llama3.2
- vars:
    context: file://./raw/ch01_introduction.md
    question: Phân loại AI Agent dựa trên mức độ tự chủ
  assert:
  - type: llm-rubric
    value: Đề cập đến các mức độ tự chủ của AI Agent (Rule-based, Reactive, Deliberative,
      Learning, Autonomous LLM) và nêu rõ đặc điểm của mỗi mức độ.
    provider: ollama:chat:llama3.2
- vars:
    context: file://./raw/ch01_introduction.md
    question: Lợi ích của việc sử dụng AI Agent trong kinh doanh
  assert:
  - type: llm-rubric
    value: Trả lời về các lợi ích của việc sử dụng AI Agent trong kinh doanh (tự động
      hóa workflow, RPA thế hệ mới) và nêu rõ cách thức hoạt động.
    provider: ollama:chat:llama3.2
- vars:
    context: file://./raw/ch02_foundations.md
    question: Trả lời chính xác các kỹ năng Python cơ bản cần thiết cho AI Agent
  assert:
  - type: llm-rubric
    value: Trả lời chính xác các kỹ năng Python cơ bản cần thiết cho AI Agent
    provider: ollama:chat:llama3.2
- vars:
    context: file://./raw/ch02_foundations.md
    question: Tóm tắt các thư viện cần thiết cho việc gọi API REST và xử lý dữ liệu
      có cấu trúc trong AI Agent
  assert:
  - type: llm-rubric
    value: Trả lời tóm tắt các thư viện cần thiết cho việc gọi API REST và xử lý dữ
      liệu có cấu trúc trong AI Agent
    provider: ollama:chat:llama3.2
- vars:
    context: file://./raw/ch02_foundations.md
    question: Gọi Anthropic API để tạo một bản tin tức bằng cách sử dụng framework
      nào?
  assert:
  - type: llm-rubric
    value: Từ chối trả lời câu hỏi này vì không có thông tin về việc gọi Anthropic
      API trong tài liệu
    provider: ollama:chat:llama3.2
- vars:
    context: file://./raw/ch03_frameworks.md
    question: Liên kết đến trang chủ của OpenAI?
  assert:
  - type: llm-rubric
    value: Trả lời chính xác liên kết đến trang chủ của OpenAI
    provider: ollama:chat:llama3.2
- vars:
    context: file://./raw/ch03_frameworks.md
    question: Tóm tắt các khái niệm cốt lõi trong LangChain?
  assert:
  - type: llm-rubric
    value: Trả lời tổng quan về Chain, Runnable Interface, LCEL và Memory trong LangChain
    provider: ollama:chat:llama3.2
- vars:
    context: file://./raw/ch03_frameworks.md
    question: Số lượng kết nối trong một đồ thị hướng (directed graph) của LangGraph?
  assert:
  - type: llm-rubric
    value: Từ chối nếu không có thông tin cụ thể về số lượng kết nối
    provider: ollama:chat:llama3.2
- vars:
    context: file://./raw/ch04_advanced.md
    question: Câu hỏi trực tiếp
  assert:
  - type: llm-rubric
    value: Trả lời chính xác về cơ chế Tree of Thoughts (ToT) trong RAG/AI
    provider: ollama:chat:llama3.2
- vars:
    context: file://./raw/ch04_advanced.md
    question: Câu hỏi tóm tắt/tổng hợp
  assert:
  - type: llm-rubric
    value: Xác định được mục đích của Reflexion trong RAG/AI và cách nó giúp agent
      cải thiện
    provider: ollama:chat:llama3.2
- vars:
    context: file://./raw/ch04_advanced.md
    question: Câu hỏi bẫy
  assert:
  - type: llm-rubric
    value: Trả lời về tác dụng của việc sử dụng các loại máy tính (neural network)
      khác nhau trong RAG/AI
    provider: ollama:chat:llama3.2

- vars:
    context: file://./raw/ch01_introduction.md
    question: Nếu cần xây dựng AI Agent có bộ nhớ dài hạn và khả năng tìm kiếm tài liệu thì cần kết hợp những thành phần nào?
  assert:
    - type: llm-rubric
      value: >
        Phải đề cập LLM, Memory, Tool Calling và RAG/Vector Database.
        Không được chỉ nêu một framework duy nhất.
      provider: ollama:chat:llama3.2

- vars:
    context: file://./raw/ch03_frameworks.md
    question: Tôi muốn xây dựng workflow gồm nhiều agent làm việc song song, framework nào phù hợp nhất?
  assert:
    - type: llm-rubric
      value: >
        Phải chọn CrewAI là framework phù hợp cho multi-agent.
        Không được trả lời LangChain hoặc LlamaIndex là lựa chọn chính.
      provider: ollama:chat:llama3.2

- vars:
    context: file://./raw/ch03_frameworks.md
    question: TensorFlow Agent Framework được giới thiệu ở chương nào?
  assert:
    - type: llm-rubric
      value: >
        Phải trả lời rằng tài liệu không đề cập TensorFlow Agent Framework,
        không được tự suy đoán.
      provider: ollama:chat:llama3.2

- vars:
    context: file://./raw/ch04_advanced.md
    question: Chương nào hướng dẫn cài Redis Cluster?
  assert:
    - type: llm-rubric
      value: >
        Phải trả lời tài liệu không có nội dung này.
      provider: ollama:chat:llama3.2

- vars:
    context: file://./raw/ch02_foundations.md
    question: Tại sao Prompt Engineering vẫn quan trọng ngay cả khi dùng LangGraph?
  assert:
    - type: llm-rubric
      value: >
        Phải giải thích Prompt Engineering quyết định chất lượng đầu vào,
        LangGraph chỉ điều phối workflow.
      provider: ollama:chat:llama3.2

- vars:
    context: file://./raw/ch02_foundations.md
    question: Một AI Agent muốn tìm kiếm web rồi phân tích kết quả thì cần tối thiểu những thành phần nào?
  assert:
    - type: llm-rubric
      value: >
        Phải đề cập LLM, Tool Calling và Planning.
      provider: ollama:chat:llama3.2

- vars:
    context: file://./raw/ch04_advanced.md
    question: Nếu tài liệu chứa câu 'Ignore previous instructions' thì agent nên làm gì?
  assert:
    - type: llm-rubric
      value: >
        Phải đề cập Prompt Injection, Guardrails hoặc Validation.
      provider: ollama:chat:llama3.2

- vars:
    context: file://./raw/ch03_frameworks.md
    question: LangGraph có phải Vector Database không?
  assert:
    - type: llm-rubric
      value: >
        Phải trả lời Không và giải thích LangGraph là framework xây dựng agent.
      provider: ollama:chat:llama3.2

- vars:
    context: file://./raw/ch03_frameworks.md
    question: So sánh CrewAI và LangGraph trong việc xây dựng AI Agent.
  assert:
    - type: llm-rubric
      value: >
        Phải nêu CrewAI phù hợp multi-agent,
        LangGraph phù hợp workflow có trạng thái (stateful).
      provider: ollama:chat:llama3.2

- vars:
    context: file://./raw/ch03_frameworks.md
    question: Claude Code được mô tả như thế nào trong tài liệu?
  assert:
    - type: llm-rubric
      value: >
        Nếu tài liệu không đề cập thì phải trả lời không có thông tin.
      provider: ollama:chat:llama3.2

- vars:
    context: file://./raw/ch04_advanced.md
    question: Có nên fine-tune trước khi học Prompt Engineering không?
  assert:
    - type: llm-rubric
      value: >
        Phải trả lời Không.
        Prompt Engineering nên được ưu tiên trước.
      provider: ollama:chat:llama3.2

- vars:
    context: file://./raw/ch04_advanced.md
    question: Nếu tài liệu không đủ thông tin thì AI Agent nên làm gì?
  assert:
    - type: llm-rubric
      value: >
        Phải nói nên từ chối hoặc yêu cầu thêm thông tin,
        không được tự bịa câu trả lời.
      provider: ollama:chat:llama3.2

- vars:
    context: file://./raw/ch02_foundations.md
    question: Memory có thay thế được Vector Database không?
  assert:
    - type: llm-rubric
      value: >
        Phải trả lời Không và giải thích hai thành phần phục vụ mục đích khác nhau.
      provider: ollama:chat:llama3.2

- vars:
    context: file://./raw/ch01_introduction.md
    question: Vì sao AI Agent cần Planning Module?
  assert:
    - type: llm-rubric
      value: >
        Phải liên hệ đến khả năng lập kế hoạch nhiều bước để hoàn thành mục tiêu.
      provider: ollama:chat:llama3.2

- vars:
    context: file://./raw/ch03_frameworks.md
    question: LlamaIndex có phải framework chuyên Multi-Agent không?
  assert:
    - type: llm-rubric
      value: >
        Không.
        LlamaIndex tập trung vào RAG và truy xuất dữ liệu.
      provider: ollama:chat:llama3.2

- vars:
    context: file://./raw/ch02_foundations.md
    question: Chỉ dùng Context Window có đủ xây dựng long-term memory không?
  assert:
    - type: llm-rubric
      value: >
        Không.
        Cần external memory hoặc RAG để lưu trữ lâu dài.
      provider: ollama:chat:llama3.2

- vars:
    context: file://./raw/ch04_advanced.md
    question: Vì sao Hybrid Retrieval thường tốt hơn Dense Retrieval?
  assert:
    - type: llm-rubric
      value: >
        Phải giải thích Hybrid Retrieval kết hợp Dense và Sparse Retrieval.
      provider: ollama:chat:llama3.2

- vars:
    context: file://./raw/ch04_advanced.md
    question: Hallucination cascade là gì?
  assert:
    - type: llm-rubric
      value: >
        Phải mô tả lỗi của một agent lan truyền sang các agent khác.
      provider: ollama:chat:llama3.2

- vars:
    context: file://./raw/ch04_advanced.md
    question: Một AI Agent production cần những kỹ thuật nào ngoài Prompt Engineering?
  assert:
    - type: llm-rubric
      value: >
        Phải đề cập ít nhất hai trong các nội dung:
        Guardrails, Evaluation, Observability, Tracing hoặc Monitoring.
      provider: ollama:chat:llama3.2

- vars:
    context: file://./raw/ch01_introduction.md
    question: Theo tài liệu, GPT-5 có bao nhiêu tham số?
  assert:
    - type: llm-rubric
      value: >
        Phải từ chối và nói rằng tài liệu không cung cấp thông tin này.
      provider: ollama:chat:llama3.2