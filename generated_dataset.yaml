# =============================================================
# Bộ testcase promptfoo — đánh giá prompt trên 4 chương tài liệu
# AI Agent (ch01 → ch04)
#
# Nguyên tắc chọn assertion type:
#   - Câu hỏi có đáp án CHỐT, liệt kê cố định, thuật ngữ cụ thể
#     → dùng contains-all / icontains-all / regex (rẻ, tất định,
#       không phụ thuộc model chấm điểm phụ)
#   - Câu hỏi yêu cầu code/syntax cụ thể → contains / regex
#   - Câu hỏi mở, cần SO SÁNH, GIẢI THÍCH, LẬP LUẬN → llm-rubric
#     (chỉ dùng khi không thể chấm bằng rule cứng)
#
# Cách dùng: dán khối "tests:" này vào promptfoo config đang có,
# hoặc trỏ testCases tới file này. Giữ nguyên context: file://
# theo đúng convention trong ví dụ gốc của bạn.
# =============================================================
  # ─────────────────────────── CHƯƠNG 1 ───────────────────────────

  - vars:
      context: file://./raw/ch01_introduction.md
      question: "AI Agent được định nghĩa gồm các thành phần nào?"
    assert:
      - type: icontains-all
        value: ["Perception", "Reasoning", "Action"]

  - vars:
      context: file://./raw/ch01_introduction.md
      question: "Liệt kê đủ 5 mức độ tự chủ của AI Agent (từ Mức 1 đến Mức 5) theo đúng thứ tự trong tài liệu."
    assert:
      - type: icontains-all
        value:
          - "Rule-based"
          - "Reactive"
          - "Deliberative"
          - "Learning"
          - "Autonomous"

  - vars:
      context: file://./raw/ch01_introduction.md
      question: "Sự khác biệt cốt lõi giữa chatbot thông thường và AI Agent là gì?"
    assert:
      - type: llm-rubric
        value: "Nêu được chatbot chỉ phản xạ đơn thuần (nhận input → sinh output), trong khi AI Agent nhận mục tiêu, tự lập kế hoạch, thực thi nhiều bước và có đánh giá kết quả (tính tự chủ, đa bước, có trạng thái)."
        

  - vars:
      context: file://./raw/ch01_introduction.md
      question: "Kể tên ít nhất 3 trong số các yếu tố thúc đẩy AI Agent bùng nổ giai đoạn 2023–2026."
    assert:
      - type: icontains-any
        value:
          - "LLM mạnh hơn"
          - "Tool use"
          - "Long context"
          - "Frameworks trưởng thành"
          - "Nhu cầu thực tế"
      - type: javascript
        value: |
          // đếm số yếu tố khớp trong 5 yếu tố hợp lệ, yêu cầu tối thiểu 3
          const keywords = ["LLM", "Tool use", "context", "Frameworks", "workflow", "RPA"];
          const hits = keywords.filter(k => output.toLowerCase().includes(k.toLowerCase())).length;
          return hits >= 3;

  - vars:
      context: file://./raw/ch01_introduction.md
      question: "Khi học về AI Agent tôi cần nắm các thuật ngữ nào?"
    assert:
      - type: icontains-all
        value: ["Prompt Engineering", "Tool Calling", "Memory Management", "Reasoning", "Evaluation", "Safety & Alignment"]


  # ─────────────────────────── CHƯƠNG 2 ───────────────────────────

  - vars:
      context: file://./raw/ch02_foundations.md
      question: "Mức nhiệt độ (temperature) nào phù hợp cho AI Agent cần đưa ra quyết định chính xác và tại sao?"
    assert:
      - type: llm-rubric
        value: "Nêu được giá trị temperature thấp (0 - 0.2) giúp mô hình hoạt động tất định, tái lập được và phù hợp với agent cần logic chính xác."
        

  - vars:
      context: file://./raw/ch02_foundations.md
      question: "Liệt kê đủ 4 loại memory trong AI Agent được đề cập trong tài liệu."
    assert:
      - type: icontains-all
        value: ["In-context", "External", "Episodic", "Semantic"]

  - vars:
      context: file://./raw/ch02_foundations.md
      question: "Viết vòng lặp tool-calling cơ bản bằng pseudocode Python dựa trên tài liệu (phải kiểm tra stop_reason)."
    assert:
      - type: contains-all
        value: ["while", "stop_reason", "tool_use"]

  - vars:
      context: file://./raw/ch02_foundations.md
      question: "Theo tài liệu, 1 token tiếng Anh xấp xỉ bao nhiêu từ?"
    assert:
      - type: regex
        value: "0\\.75"

  - vars:
      context: file://./raw/ch02_foundations.md
      question: "Kể tên ít nhất 3 metric cơ bản dùng để đánh giá (evaluate) một AI Agent."
    assert:
      - type: icontains-any
        value:
          - "Task completion rate"
          - "Step efficiency"
          - "Tool usage accuracy"
          - "Hallucination rate"
          - "Latency"
          - "Cost per task"
      - type: javascript
        value: |
          const keywords = ["completion", "efficiency", "accuracy", "hallucination", "latency", "cost"];
          const hits = keywords.filter(k => output.toLowerCase().includes(k)).length;
          return hits >= 3;

  # ─────────────────────────── CHƯƠNG 3 ───────────────────────────

  - vars:
      context: file://./raw/ch03_frameworks.md
      question: "LangChain phù hợp và không phù hợp trong những trường hợp nào?"
    assert:
      - type: llm-rubric
        value: "Nêu được LangChain phù hợp cho prototype nhanh, tích hợp nhiều LLM, hệ sinh thái connector phong phú; nhưng không phù hợp cho agent logic phức tạp (nên dùng LangGraph thay thế)."
        

  - vars:
      context: file://./raw/ch03_frameworks.md
      question: "Trong LangGraph, 3 khái niệm cốt lõi State, Node, Edge có vai trò gì?"
    assert:
      - type: icontains-all
        value: ["State", "Node", "Edge"]

  - vars:
      context: file://./raw/ch03_frameworks.md
      question: "CrewAI hỗ trợ những loại Process (quy trình làm việc) nào? Kể tên đủ 2 loại."
    assert:
      - type: icontains-all
        value: ["sequential", "hierarchical"]

  - vars:
      context: file://./raw/ch03_frameworks.md
      question: "Viết lệnh cài đặt LangChain kèm tích hợp Anthropic bằng pip."
    assert:
      - type: contains
        value: "pip install langchain langchain-anthropic"

  - vars:
      context: file://./raw/ch03_frameworks.md
      question: "Framework nào trong bảng so sánh phù hợp nhất cho RAG chuyên sâu trên tài liệu lớn?"
    assert:
      - type: icontains
        value: "LlamaIndex"

  # ─────────────────────────── CHƯƠNG 4 ───────────────────────────

  - vars:
      context: file://./raw/ch04_advanced.md
      question: "Tree of Thoughts (ToT) khác Chain-of-Thought (CoT) thông thường ở điểm nào?"
    assert:
      - type: llm-rubric
        value: "Nêu được ToT khám phá nhiều hướng suy luận (thought) song song, đánh giá độ hứa hẹn của từng thought rồi mở rộng/loại bỏ, trong khi CoT đi theo một luồng suy luận tuyến tính duy nhất."
        

  - vars:
      context: file://./raw/ch04_advanced.md
      question: "Liệt kê đủ 4 mô hình phối hợp trong Multi-Agent Coordination."
    assert:
      - type: icontains-all
        value: ["Orchestrator", "Peer-to-Peer", "Pipeline", "Blackboard"]

  - vars:
      context: file://./raw/ch04_advanced.md
      question: "Kể tên các phương pháp retrieval trong Advanced RAG (ít nhất 3)."
    assert:
      - type: icontains-any
        value: ["Dense retrieval", "Sparse retrieval", "Hybrid retrieval", "Multi-query", "HyDE"]
      - type: javascript
        value: |
          const keywords = ["dense", "sparse", "hybrid", "multi-query", "hyde"];
          const hits = keywords.filter(k => output.toLowerCase().includes(k)).length;
          return hits >= 3;

  - vars:
      context: file://./raw/ch04_advanced.md
      question: "Nêu ít nhất 2 biện pháp phòng thủ trước tấn công Prompt Injection."
    assert:
      - type: llm-rubric
        value: "Nêu được ít nhất 2 trong số: phân tách rõ system context vs user-provided data, validate/sanitize input từ nguồn ngoài, dùng sandboxed LLM call cho untrusted data, implement constitutional AI checks."
        

  - vars:
      context: file://./raw/ch04_advanced.md
      question: "MCP (nhắc đến ở phần Emerging Patterns) là viết tắt của cụm từ tiếng Anh nào?"
    assert:
      - type: contains
        value: "Model Context Protocol"